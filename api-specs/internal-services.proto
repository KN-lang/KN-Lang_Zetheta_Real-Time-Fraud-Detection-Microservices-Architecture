syntax = "proto3";
package shieldpay.internal.v1;

message TransactionContext { string transaction_id = 1; string customer_id = 2; map<string, string> attributes = 3; map<string, double> features = 4; }
message RuleRequest { TransactionContext context = 1; }
message RuleResponse { repeated string matched_rule_ids = 1; double score = 2; repeated string explanations = 3; }
service RuleEngineService { rpc Evaluate(RuleRequest) returns (RuleResponse); }
message AnomalyRequest { TransactionContext context = 1; string model_family = 2; }
message AnomalyResponse { double score = 1; string model_version = 2; repeated string top_features = 3; }
service AnomalyDetectionService { rpc Score(AnomalyRequest) returns (AnomalyResponse); }
message GraphRequest { string transaction_id = 1; string customer_id = 2; string device_id = 3; string merchant_id = 4; string ip_address = 5; }
message GraphResponse { double graph_risk_score = 1; repeated string suspicious_paths = 2; repeated string entities = 3; }
service GraphAnalysisService { rpc Analyze(GraphRequest) returns (GraphResponse); }
message RiskScoreRequest { string transaction_id = 1; RuleResponse rules = 2; AnomalyResponse anomaly = 3; GraphResponse graph = 4; }
message RiskScoreResponse { double score = 1; string decision = 2; repeated string reasons = 3; }
service RiskScoringService { rpc Decide(RiskScoreRequest) returns (RiskScoreResponse); }
message ProfileRequest { string customer_id = 1; string account_id = 2; }
message ProfileResponse { map<string, string> attributes = 1; map<string, double> aggregates = 2; }
service CustomerProfileService { rpc GetProfile(ProfileRequest) returns (ProfileResponse); }
message FeatureRequest { string entity_id = 1; repeated string feature_names = 2; }
message FeatureResponse { map<string, double> numeric_features = 1; map<string, string> categorical_features = 2; }
service FeatureStoreService { rpc GetOnlineFeatures(FeatureRequest) returns (FeatureResponse); }
