_format_version: "3.0"
services:
  - name: transaction-ingestion
    url: http://transaction-ingestion:8080
    routes:
      - name: submit-transaction
        paths: [/api/v1/transactions]
        methods: [POST]
    plugins:
      - name: rate-limiting
        config:
          minute: 6000
          policy: local
      - name: correlation-id
  - name: case-management
    url: http://case-management:8080
    routes:
      - name: cases
        paths: [/api/v1/cases]
        methods: [GET, PUT]
